version: 2
updates:
  # npm/pnpm — der Root-Lockfile deckt das ganze Workspace ab.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Minor/Patch gebündelt in einen PR (majors einzeln zum Reviewen).
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
