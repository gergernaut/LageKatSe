version: 2
updates:
  # npm/pnpm — der Root-Lockfile deckt das ganze Workspace ab.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # react + react-dom (+ ihre @types) IMMER gemeinsam anheben — sonst
      # reißt Dependabot sie auseinander und es entsteht ein react/react-dom-
      # Versions-Mismatch (ReactSharedInternals undefined → weiße Seite).
      # Ohne update-types → gilt für alle Bump-Arten; zuerst gelistet → greift
      # für react-Pakete vor der Minor/Patch-Gruppe.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # vite + @vitejs/plugin-react sind ebenfalls ein Paar: der Plugin-Major
      # folgt dem Vite-Major (plugin-react 6 braucht Vite >= 7, sonst fehlt der
      # vite/internal-Export und der Build bricht). Also zusammen anheben.
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
      # Minor/Patch gebündelt in einen PR (majors einzeln zum Reviewen).
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
