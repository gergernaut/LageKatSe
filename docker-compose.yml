# LageKatSe production deployment (reverse-proxy + TLS).
#
# Bring everything up from prebuilt GHCR images (no repo clone needed, #99):
#   docker compose pull && docker compose up -d
# You only need this file + Caddyfile + a .env (see README → Deployment).
#
# Build from source instead of pulling (dev / local changes):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The reverse proxy (Caddy) terminates TLS and routes:
#   /api/*, /sync/* → backend, /* → web (static SPA).
#
# For local dev (without Docker), just run `pnpm dev` — this compose file
# is for production/pilot deployments. The `db` service can also be used
# standalone for dev (`docker compose up -d db`).
#
# Required env (set in .env or environment):
#   DOMAIN       — public hostname, e.g. lagekatse.example.org
#   CADDY_EMAIL  — email for Let's-Encrypt certificate notifications
#   JWT_SECRET   — a strong random string (NOT the default)
#   DATABASE_URL — postgres connection string
#   CORS_ORIGIN  — the origin the browser uses (https://<DOMAIN>); irrelevant
#                  for same-origin behind the proxy, but set it to be safe.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lagekatse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lagekatse}
      POSTGRES_DB: lagekatse
    volumes:
      - lagekatse_pg:/var/lib/postgresql/data
      # Kein schema.sql-Init-Mount mehr: das Backend wendet das Schema selbst
      # autoritativ bei jedem Start an (PostgresStore.init(), idempotent).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagekatse -d lagekatse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Fertiges Image aus GHCR (#99): `docker compose pull && up -d` ohne Repo-Klon.
    # Version festnageln via LAGEKATSE_IMAGE_TAG (z.B. =1.2.3), sonst latest.
    # Aus dem Quellcode bauen: docker-compose.build.yml als Override zuschalten.
    image: ghcr.io/gergernaut/lagekatse-backend:${LAGEKATSE_IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DATABASE_URL: postgres://lagekatse:${POSTGRES_PASSWORD:-lagekatse}@db:5432/lagekatse
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN}}
      TRUST_PROXY: "true"
      RATE_LIMIT_MAX: "300"
      RATE_LIMIT_SENSITIVE_MAX: "30"
      RATE_LIMIT_WINDOW_MS: "60000"
      RETENTION_DAYS: "28"
      RETENTION_INTERVAL_MS: "86400000"
    restart: unless-stopped

  web:
    image: ghcr.io/gergernaut/lagekatse-web:${LAGEKATSE_IMAGE_TAG:-latest}
    # Optional: Grundkarten-Tile-URL pro Deployment überschreiben (#96), ohne
    # Neu-Build — z.B. auf einen lokalen Tile-Server im geschlossenen Netz zeigen.
    # Vorlage: config.js.example nach config.js kopieren und tileUrl setzen.
    # volumes:
    #   - ./config.js:/srv/config.js:ro
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optionaler eigener Tile-Server (#96, Phase 2) — nur mit Profil aktiv:
  #   docker compose --profile tiles up -d
  # Liefert OSM-Raster-Kacheln unter /tile/{z}/{x}/{y}.png. Vor dem ERSTEN Start
  # einmalig einen Regionalauszug importieren (dauert je nach Region Stunden,
  # braucht mehrere GB) — Schritt für Schritt in docs/tiles.md. Der Default der
  # App bleibt OSM-Public; dieser Dienst ist nur für offline/geschlossene Netze.
  tiles:
    image: overv/openstreetmap-tile-server:latest
    profiles: ["tiles"]
    command: run
    shm_size: "256m"
    environment:
      THREADS: "4"          # Render-Threads (an CPU anpassen)
      ALLOW_CORS: "enabled" # CORS-Header für die Kacheln
    ports:
      - "8081:80"           # Direktzugriff: http://<host>:8081/tile/{z}/{x}/{y}.png
    volumes:
      - osm_tiles_db:/data/database
      - osm_tiles_tiles:/data/tiles
    restart: unless-stopped

volumes:
  lagekatse_pg:
  caddy_data:
  caddy_config:
  osm_tiles_db:
  osm_tiles_tiles: